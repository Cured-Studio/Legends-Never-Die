<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes — The Plate Scraper</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c75b39'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23faf5ec'/%3E%3C/svg%3E">
</head>
<body>
<div id="nav"></div>
<main>
  <div class="wrap" style="padding-top:34px">
    <h1 style="font-size:38px; margin:0 0 6px">The recipe library</h1>
    <p style="color:var(--ink-soft); margin:0 0 20px">Every recipe here is original to our kitchen — or one you scraped yourself. Search by name or by what's in your pantry.</p>
    <div style="display:grid; grid-template-columns:1.4fr auto auto; gap:12px; margin-bottom:18px">
      <input type="search" id="q" placeholder="Search recipes… try 'chicken' or 'curry'">
      <select id="cat" style="width:auto; min-width:160px">
        <option value="all">All categories</option>
      </select>
      <select id="sort" style="width:auto; min-width:150px">
        <option value="popular">Most loved</option>
        <option value="quickest">Quickest first</option>
        <option value="newest">Newest first</option>
      </select>
    </div>
    <div class="pillrow" id="chips" style="margin-bottom:22px"></div>
    <div class="recipe-grid" id="grid"><div class="empty-plate"><div class="big">🍜</div>Warming up the pots…</div></div>
  </div>
</main>
<footer id="footer"></footer>
<script src="/app.js"></script>
<script>
TNS.init("recipes");
let state = { q: "", cat: new URLSearchParams(location.search).get("category") || "all", sort: "popular" };
const grid = document.getElementById("grid");
const q = document.getElementById("q"), cat = document.getElementById("cat"), sort = document.getElementById("sort");

async function refresh() {
  const url = "recipes?search=" + encodeURIComponent(state.q) + "&category=" + encodeURIComponent(state.cat) + "&sort=" + state.sort;
  try {
    const d = await TNS.api(url);
    if (!d.recipes.length) grid.innerHTML = '<div class="empty-plate" style="grid-column:1/-1"><div class="big">🍽</div>Nothing matches that. Try a wider net.</div>';
    else grid.innerHTML = d.recipes.map(TNS.recipeCard).join("");
  } catch (e) { grid.innerHTML = '<div class="empty-plate" style="grid-column:1/-1"><div class="big">⚠️</div>' + TNS.esc(e.message) + "</div>"; }
}

let t;
q.addEventListener("input", () => { state.q = q.value; clearTimeout(t); t = setTimeout(refresh, 250); });
sort.addEventListener("change", () => { state.sort = sort.value; refresh(); });

(async () => {
  const d = await TNS.api("recipes");
  const cats = [...new Set(d.recipes.map(r => r.category))];
  cats.forEach(c => cat.insertAdjacentHTML("beforeend", '<option value="' + c + '">' + c + "</option>"));
  cat.value = state.cat;
  cat.addEventListener("change", () => { state.cat = cat.value; refresh(); });
  document.getElementById("chips").innerHTML =
    '<button class="pill" data-c="all" style="cursor:pointer">All</button>' +
    cats.map(c => '<button class="pill" data-c="' + c + '" style="cursor:pointer">' + c + "</button>").join("");
  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest("button[data-c]"); if (!b) return;
    state.cat = b.dataset.c; cat.value = b.dataset.c; refresh();
  });
  refresh();
})();
</script>
</body>
</html>
