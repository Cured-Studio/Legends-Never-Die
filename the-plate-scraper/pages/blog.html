<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — The Plate Scraper</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c75b39'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23faf5ec'/%3E%3C/svg%3E">
</head>
<body>
<div id="nav"></div>
<main>
  <div class="wrap" style="padding-top:34px; max-width:820px">
    <div id="view"></div>
  </div>
</main>
<footer id="footer"></footer>
<script src="/app.js"></script>
<script>
TNS.init("blog");

function postCard(p) {
  return '<a class="recipe-card" style="text-decoration:none; margin-bottom:18px" href="/blog.html?post=' + p.id + '">' +
    '<div class="body">' +
    '<span class="pill" style="align-self:flex-start">' + TNS.esc((p.tags && p.tags[0]) || "kitchen notes") + "</span>" +
    "<h3>" + TNS.esc(p.title) + "</h3>" +
    '<p class="desc" style="-webkit-line-clamp:3; font-size:14.5px">' + TNS.esc(p.intro || "") + "</p>" +
    '<div class="meta"><span>📅 ' + TNS.timeAgo(p.ts) + "</span>" + (p.credit ? '<span>· adapted from ' + TNS.esc(p.credit.split(" on ").pop()) + "</span>" : "") + "</div>" +
    "</div></a>";
}

function detail(p) {
  return '<div class="crumb"><a href="/">Home</a> · <a href="/blog.html">Blog</a> · <span>post</span></div>' +
    '<h1 style="font-size:clamp(28px,4vw,40px); line-height:1.1; margin:8px 0 10px">' + TNS.esc(p.title) + "</h1>" +
    '<div class="meta-chips"><span class="chip">📅 ' + TNS.timeAgo(p.ts) + "</span>" +
    (p.tags || []).map(t => '<span class="chip">#' + TNS.esc(t) + "</span>").join("") + "</div>" +
    '<p style="font-size:17px; font-family:var(--serif); font-style:italic; color:var(--ink-soft)">' + TNS.esc(p.intro || "") + "</p>" +
    (p.body || []).map(x => "<p style='font-size:16px; line-height:1.7; color:#3d362c'>" + TNS.esc(x) + "</p>").join("") +
    (p.houseNote ? '<div class="banner ok show" style="margin:18px 0">' + TNS.esc(p.houseNote) + "</div>" : "") +
    (p.credit ? '<p style="font-size:13px; color:var(--ink-faint); font-style:italic; border-left:3px solid var(--line); padding-left:14px">' +
      TNS.esc(p.credit) + (p.sourceLink ? ' · <a href="' + TNS.esc(p.sourceLink) + '" target="_blank" rel="noopener nofollow">read the original ↗</a>' : "") + "</p>" : "") +
    '<p class="signoff" style="font-size:13.5px; color:var(--ink-soft); font-style:italic; margin-top:18px">' + TNS.esc(p.signoff || "") + "</p>" +
    '<div style="margin-top:30px"><a class="btn btn-primary" href="/recipes.html">Find a recipe to cook →</a></div>';
}

(async () => {
  const view = document.getElementById("view");
  const id = new URLSearchParams(location.search).get("post");
  try {
    if (id) {
      const d = await TNS.api("blog/" + id);
      view.innerHTML = detail(d.post);
      document.title = d.post.title + " — The Plate Scraper";
      return;
    }
    const d = await TNS.api("blog");
    if (!d.posts || !d.posts.length) {
      view.innerHTML = '<h1 style="font-size:36px">From the blog</h1>' +
        '<div class="empty-plate" style="margin-top:30px"><div class="big">📖</div>First posts are on the stove — check back soon.</div>';
      return;
    }
    view.innerHTML = '<h1 style="font-size:36px; margin:0 0 6px">From the blog</h1>' +
      '<p style="color:var(--ink-soft); margin:0 0 24px">Notes from our kitchen, recipes we tested, and dishes we adapted from the blogs we follow — always with credit.</p>' +
      d.posts.map(postCard).join("");
  } catch (e) {
    view.innerHTML = '<div class="empty-plate"><div class="big">⚠️</div>' + TNS.esc(e.message) + "</div>";
  }
})();
</script>
</body>
</html>
