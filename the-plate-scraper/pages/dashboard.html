<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Kitchen — Members Area · The Plate Scraper</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c75b39'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23faf5ec'/%3E%3C/svg%3E">
</head>
<body>
<div id="nav"></div>
<main>
  <div class="wrap" style="padding-top:34px" id="main">
    <div class="empty-plate"><div class="big">🔐</div>Checking your kitchen…</div>
  </div>
</main>
<footer id="footer"></footer>
<script src="/app.js"></script>
<script>
TNS.init("");
(async () => {
  const me = await TNS.loadMe();
  const main = document.getElementById("main");
  if (!me) { location.href = "/members.html"; return; }
  let saved = [], list = [], posts = [];
  try {
    const d = await TNS.api("saved"); saved = d.recipes;
    list = (await TNS.api("list")).items;
    const p = await TNS.api("rss/posts"); posts = p.posts || [];
  } catch (e) {}
  const tierLabel = { free: "Free", premium: "Premium", legend: "Legend" }[me.tier];
  const initials = me.name.split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase();
  main.innerHTML =
    '<h1 style="font-size:34px; margin:0 0 4px">My Kitchen</h1>' +
    '<p style="color:var(--ink-soft); margin:0 0 22px">Welcome back, ' + TNS.esc(me.name) + " — here's what's simmering.</p>" +
    '<div class="dash-grid"><div>' +
    '<div class="profile-card"><div class="avatar">' + initials + "</div>" +
    "<b style='font-size:18px'>" + TNS.esc(me.name) + "</b>" +
    '<div style="font-size:13px; color:var(--ink-faint); margin:2px 0 10px">' + TNS.esc(me.email) + "</div>" +
    '<span class="tierbadge ' + me.tier + '">' + tierLabel + "</span>" +
    '<div class="ministats">' +
    '<div class="ms"><b>' + saved.length + "</b><span>saved</span></div>" +
    '<div class="ms"><b>' + list.filter(i => !i.purchased).length + "</b><span>to buy</span></div>" +
    '<div class="ms"><b>' + (me.scrapes ? me.scrapes.length : 0) + "</b><span>scrapes</span></div></div>" +
    '<div class="field" style="margin-top:14px"><label>Display name</label><input type="text" id="pn" value="' + TNS.esc(me.name) + '"></div>' +
    '<button class="btn btn-dark btn-sm" id="b-pn">Save profile</button>' +
    '<div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap">' +
    (me.is_admin ? '<a class="btn btn-ghost btn-sm" href="/affiliate.html">🎛 Affiliate Control Panel</a>' : "") +
    '<a class="btn btn-ghost btn-sm" href="/setup.html">🗄 MySQL Wizard</a>' +
    '<button class="btn btn-ghost btn-sm" id="b-out">Sign out</button></div></div>' +
    '<div class="sidebox" style="margin-top:16px"><h3>Membership</h3>' +
    '<div style="font-size:13.5px; color:var(--ink-soft); margin-bottom:12px">You\'re on <b>' + tierLabel + "</b>." +
    (me.tier === "free" ? " Unlock syncing and your full library." : me.tier === "premium" ? " One step from the whole arsenal." : " The top shelf. Enjoy.") + "</div>" +
    (me.tier !== "premium" ? '<button class="btn btn-primary btn-sm" data-tier="premium" id="b-pre">⚡ Upgrade to Premium — $9/mo</button>' : "") +
    (me.tier !== "legend" ? '<button class="btn btn-dark btn-sm" data-tier="legend" id="b-leg" style="margin-top:8px">👑 Go Legend — $19/mo</button>' : "") +
    "<p style='font-size:11.5px; color:var(--ink-faint); margin:10px 0 0'>Demo checkout — no card charged.</p></div>" +
    "</div><div>" +
    '<div class="panel" style="margin-bottom:20px"><h2 style="font-size:20px; margin-bottom:12px">📡 Rewritten posts (Feed Room)</h2>' +
    (posts.length ? posts.map(p => '<div class="recents"><div class="r"><span>' + TNS.esc(p.title) + '</span><span class="d">' +
      (p.status === "published" ? "🚀 published · " : "📝 draft · ") + TNS.timeAgo(p.ts) + "</span></div></div>").join("")
    : '<p style="font-size:13.5px; color:var(--ink-faint); margin:0">No rewritten posts yet — try the <a href="/feedroom.html">Feed Room</a> and hit “Rewrite in house style.”</p>') +
    "</div>" +
    '<div class="panel"><h2 style="font-size:20px; margin-bottom:4px">❤️ Saved recipes</h2>' +
    (saved.length ? '<div class="recipe-grid" style="margin-top:14px">' + saved.map(r => TNS.recipeCard({ ...r, savedByMe: true })).join("") + "</div>"
    : '<p style="font-size:13.5px; color:var(--ink-faint); margin:8px 0 0">Nothing saved yet — tap the 🤍 on any recipe card.</p>') +
    "</div>" +
    '<div class="panel" style="margin-top:20px"><h2 style="font-size:20px; margin-bottom:4px">🧲 Recent scrapes</h2>' +
    ((me.scrapes && me.scrapes.length) ? '<div class="recents">' + me.scrapes.slice(-5).reverse().map(s =>
      '<div class="r"><span>' + TNS.esc(s.title) + (s.source ? " · " + TNS.esc(s.source) : "") + '</span><span class="d">' + TNS.timeAgo(s.ts) + "</span></div>").join("") + "</div>"
    : '<p style="font-size:13.5px; color:var(--ink-faint); margin:8px 0 0">Your scraped recipes will show up here.</p>') +
    "</div></div></div>";

  document.getElementById("b-out").onclick = () => TNS.signOut();
  document.getElementById("b-pn").onclick = async () => {
    try {
      const d = await TNS.api("profile", { body: { name: document.getElementById("pn").value } });
      TNS.me = d.user; TNS.toast("Profile updated", "ok");
    } catch (e) { TNS.toast(e.message, "err"); }
  };
  ["b-pre", "b-leg"].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.onclick = async () => {
      try {
        const d = await TNS.api("tier", { body: { tier: b.dataset.tier } });
        TNS.me = d.user;
        TNS.toast(d.note + " Welcome to " + b.dataset.tier.toUpperCase() + " 🎉", "ok");
        setTimeout(() => location.reload(), 900);
      } catch (e) { TNS.toast(e.message, "err"); }
    };
  });
})();
</script>
</body>
</html>
